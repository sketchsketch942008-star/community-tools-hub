<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaCard Studio - 社交媒体卡片与元标签实时生成器</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
    header { max-width: 1200px; margin: 0 auto 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 16px; }
    h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 10px; color: var(--accent); }
    .badge { font-size: 0.75rem; background: #0284c7; color: white; padding: 2px 8px; border-radius: 999px; }
    .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
    .panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; }
    .panel h2 { font-size: 1.15rem; margin-bottom: 16px; color: var(--text); border-bottom: 1px solid var(--card-border); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: var(--text-muted); }
    input, textarea, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--card-border); background: #0b1120; color: #fff; font-size: 0.9rem; transition: border-color 0.2s; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    .preview-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { background: #0b1120; border: 1px solid var(--card-border); color: var(--text-muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .tab-btn.active { background: var(--accent); color: #0f172a; font-weight: 600; border-color: var(--accent); }
    .preview-box { border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 20px; }
    .twitter-card { max-width: 500px; margin: 0 auto; border: 1px solid #2f3336; border-radius: 16px; overflow: hidden; background: #000; font-family: TwitterChirp, -apple-system, sans-serif; }
    .twitter-img { width: 100%; height: 260px; object-fit: cover; background: #16181c; display: flex; align-items: center; justify-content: center; color: #71767b; }
    .twitter-content { padding: 12px; background: #000; }
    .twitter-domain { font-size: 0.8rem; color: #71767b; text-transform: lowercase; }
    .twitter-title { font-size: 0.95rem; font-weight: 700; color: #e7e9ea; margin: 4px 0 2px; line-height: 1.3; }
    .twitter-desc { font-size: 0.85rem; color: #71767b; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .serp-card { background: #fff; color: #202124; padding: 16px; border-radius: 8px; max-width: 550px; font-family: arial, sans-serif; }
    .serp-url { font-size: 0.8rem; color: #202124; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .serp-title { font-size: 1.15rem; color: #1a0dab; text-decoration: none; cursor: pointer; margin-bottom: 4px; }
    .serp-title:hover { text-decoration: underline; }
    .serp-desc { font-size: 0.85rem; color: #4d5156; line-height: 1.4; }
    
    .code-container { position: relative; }
    pre { background: #0b1120; border: 1px solid var(--card-border); border-radius: 8px; padding: 14px; font-size: 0.8rem; color: #38bdf8; overflow-x: auto; line-height: 1.5; }
    .copy-btn { position: absolute; top: 10px; right: 10px; background: var(--accent); color: #0f172a; border: none; padding: 4px 10px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.75rem; }
    .copy-btn:hover { background: var(--accent-hover); }
    .status-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.8rem; color: var(--success); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>MetaCard Studio <span class="badge">v1.0.0</span></h1>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">即开即用 · 社交媒体与搜索引擎元标签实时可视化生成器</p>
    </div>
    <div class="status-tag">
      <span style="width:8px; height:8px; border-radius:50%; background:var(--success);"></span> 客户端纯净运行 (无泄露 / 零依赖)
    </div>
  </header>

  <div class="container">
    <!-- 编辑配置区 -->
    <div class="panel">
      <h2>配置元标签数据</h2>
      <div class="form-group">
        <label>页面标题 (Title / og:title)</label>
        <input type="text" id="inp-title" value="MetaCard Studio - 开发者必备的社交卡片生成神器" placeholder="输入页面标题">
      </div>
      <div class="form-group">
        <label>页面描述 (Description / og:description)</label>
        <textarea id="inp-desc" placeholder="简要概括网页内容（建议80-160字）">极简、高效、纯前端运行的元标签生成与实时卡片预览工具。支持 Twitter Summary Large Image、Open Graph 与 Google SERP 模拟展示。</textarea>
      </div>
      <div class="form-group">
        <label>规范网址 (Canonical URL / og:url)</label>
        <input type="url" id="inp-url" value="https://sketch.github.io/meta-card-previewer" placeholder="https://example.com/page">
      </div>
      <div class="form-group">
        <label>封面图片链接 (og:image / twitter:image)</label>
        <input type="url" id="inp-image" value="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&h=630&fit=crop" placeholder="建议 1200x630 比例">
      </div>
      <div class="form-group" style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
        <div>
          <label>Twitter 账号 (@handle)</label>
          <input type="text" id="inp-twitter" value="@sketch_dev" placeholder="@username">
        </div>
        <div>
          <label>卡片类型</label>
          <select id="inp-card-type">
            <option value="summary_large_image">大图卡片 (summary_large_image)</option>
            <option value="summary">小图摘要 (summary)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 实时预览与代码区 -->
    <div class="panel">
      <h2>
        <span>实时效果预览</span>
        <div class="preview-tabs">
          <button class="tab-btn active" onclick="switchTab('twitter')">Twitter (X)</button>
          <button class="tab-btn" onclick="switchTab('google')">Google SERP</button>
        </div>
      </h2>

      <!-- Twitter Preview -->
      <div id="view-twitter" class="preview-box" style="padding: 20px; background: #000;">
        <div class="twitter-card">
          <img id="tw-preview-img" class="twitter-img" src="" alt="Card Image Preview">
          <div class="twitter-content">
            <div id="tw-preview-domain" class="twitter-domain">example.com</div>
            <div id="tw-preview-title" class="twitter-title">页面标题预览</div>
            <div id="tw-preview-desc" class="twitter-desc">页面描述预览内容...</div>
          </div>
        </div>
      </div>

      <!-- Google SERP Preview -->
      <div id="view-google" class="preview-box" style="padding: 20px; background: #f8fafc; display:none;">
        <div class="serp-card">
          <div class="serp-url" id="serp-preview-url">https://example.com › page</div>
          <div class="serp-title" id="serp-preview-title">页面标题预览</div>
          <div class="serp-desc" id="serp-preview-desc">页面描述预览内容...</div>
        </div>
      </div>

      <h2>
        <span>生成 HTML 标签代码</span>
      </h2>
      <div class="code-container">
        <button class="copy-btn" onclick="copyCode()">复制全部代码</button>
        <pre><code id="output-code"></code></pre>
      </div>
    </div>
  </div>

  <script>
    function update() {
      const title = document.getElementById('inp-title').value.trim() || '页面标题';
      const desc = document.getElementById('inp-desc').value.trim() || '页面描述信息';
      const url = document.getElementById('inp-url').value.trim() || 'https://example.com';
      const image = document.getElementById('inp-image').value.trim() || 'https://placehold.co/1200x630/1e293b/38bdf8?text=Preview+Image';
      const twitterHandle = document.getElementById('inp-twitter').value.trim();
      const cardType = document.getElementById('inp-card-type').value;

      let hostname = 'example.com';
      try { hostname = new URL(url).hostname; } catch(e){}

      // Twitter 预览更新
      document.getElementById('tw-preview-title').textContent = title;
      document.getElementById('tw-preview-desc').textContent = desc;
      document.getElementById('tw-preview-domain').textContent = hostname;
      document.getElementById('tw-preview-img').src = image;

      // Google SERP 预览更新
      document.getElementById('serp-preview-title').textContent = title;
      document.getElementById('serp-preview-desc').textContent = desc;
      document.getElementById('serp-preview-url').textContent = url.replace('https://', '').replace('http://', '');

      // 生成代码
      const htmlTags = `<!-- Primary Meta Tags -->
<title>${title}</title>
<meta name="title" content="${title}">
<meta name="description" content="${desc}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="${url}">
<meta property="og:title" content="${title}">
<meta property="og:description" content="${desc}">
<meta property="og:image" content="${image}">

<!-- Twitter Card -->
<meta property="twitter:card" content="${cardType}">
<meta property="twitter:url" content="${url}">
<meta property="twitter:title" content="${title}">
<meta property="twitter:description" content="${desc}">
<meta property="twitter:image" content="${image}">` + (twitterHandle ? `\n<meta property="twitter:creator" content="${twitterHandle}">` : '');

      document.getElementById('output-code').textContent = htmlTags;
    }

    function switchTab(type) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if(type === 'twitter') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('view-twitter').style.display = 'block';
        document.getElementById('view-google').style.display = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('view-twitter').style.display = 'none';
        document.getElementById('view-google').style.display = 'block';
      }
    }

    function copyCode() {
      const code = document.getElementById('output-code').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = '已复制到剪贴板！';
        btn.style.background = '#10b981';
        setTimeout(() => {
          btn.textContent = '复制全部代码';
          btn.style.background = '#38bdf8';
        }, 2000);
      });
    }

    document.querySelectorAll('input, textarea, select').forEach(el => {
      el.addEventListener('input', update);
    });

    // 初始化
    update();
  </script>
</body>
</html>
